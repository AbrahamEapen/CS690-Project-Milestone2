# Test configuration for CS690 Milestone 2 (S-3). pytest settings stay in pytest.ini.

[tool.coverage.report]
# Deliverable 5d: the README test command fails below 80 percent coverage of the story code.
fail_under = 80
show_missing = true

[tool.mutmut]
# Deliverable 5e: copy all of src/ into mutants/, but mutate only the S-3 story logic
# (team decision: ranking.py and ranking_store.py; api.py and S-1's pipeline.py are not mutated).
source_paths = ["src/"]
only_mutate = ["src/jobsboard/ranking.py", "src/jobsboard/ranking_store.py"]
also_copy = ["pytest.ini"]
